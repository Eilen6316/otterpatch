name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      # electron's GUI binary isn't needed for typecheck/build/test — skip the ~100MB download
      - name: Install
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Typecheck (tsc -b)
        run: npm run typecheck
      - name: Test (all workspaces)
        run: npm test
      - name: Real writeback regression
        run: npm run test:real-writeback
      - name: Build all workspaces
        run: npm run build
      - name: Serve security regression
        run: npm run test:serve-security
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Headless e2e (mocked model, no key) — the behavior contract
        run: |
          set -e
          for t in ui-smoke drawio-review-e2e richdoc-toolbar richdoc-projection-e2e richdoc-editing-e2e richdoc-revisions-e2e word-agent-mock word-review-e2e word-table-e2e word-docfmt-e2e word-autobatch-e2e word-docx-import-e2e excel-agent-mock; do
            echo "── $t ──"
            node "test/$t.mjs"
          done

  packaged-desktop-smoke:
    name: Packaged desktop smoke (${{ matrix.os }})
    needs: build-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install with Electron runtime
        run: npm ci
      - name: Build packaged local service
        run: npm run build --workspace @otterpatch/mcp-server
      - name: Package desktop application
        run: npm run app:pack:dir --workspace @otterpatch/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Launch packaged application
        run: npm run test:packaged --workspace @otterpatch/desktop

  real-model-smoke:
    # BYOK end-to-end smoke; runs only when the OtterPatch_API_KEY secret is configured.
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - name: Real-model smoke (gated on secret)
        env:
          OtterPatch_API_KEY: ${{ secrets.OtterPatch_API_KEY }}
          OtterPatch_PROVIDER: ${{ vars.OtterPatch_PROVIDER }}
        run: npm run smoke
